intent_clear:
  label: 意図の明確さ
  question: 単なる名詞句や挨拶ではなく、行動の要求、質問、または会話への返答を表しているか？
  criteria:
    "true": 作業の指示、質問、方針の選択、または会話への返答・承認（「了解」「LGTM」等）である。
    "false": 動詞のない単なる名詞句（例:「ログインの送信ボタン」）、または単なる挨拶（例:「こんにちは」）である。
  clarification: 行いたい操作や確認したい質問を明示してください。

context_sufficient:
  label: 文脈の充足度
  question: プロンプト単体または直前の会話を踏まえて、対象を特定できるか？
  criteria:
    "true": 対象がプロンプト内で示されているか、直前の会話から特定できる。会話の流れに沿った短い返答も含む。
    "false": 会話に前提がない指示語（例:「それを直して」）、または会話がない状態での対象不明な操作（例:「コミット」）である。
  clarification: 対象の指定、選択肢の選択、または期待する結果を具体化してください。

consistent:
  label: 指示の整合性
  question: user_promptの指示は矛盾せず、直前の会話がある場合はその流れとも整合しているか？
  criteria:
    "true": 指示に矛盾がなく、会話への確認・質問・具体化・方針変更の指示も整合している。複数の手順や限定条件（「〜だけ」「〜しない」等）の併用、壁打ち、現状指摘と改善要望も問題ない。
    "false": 同時に満たせない相反する指示を出している、または会話の作業と全く無関係な別タスクへ前置きなく急に切り替わっている。
  clarification: 矛盾する条件や話題の飛躍を解消し、意図や優先度を明確にしてください。
