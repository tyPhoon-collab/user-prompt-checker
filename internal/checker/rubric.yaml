complete:
  label: 入力の完結性
  question: user_promptは途中送信や言い差し、単なる名詞句・挨拶ではなく、完結した発話（指示・質問・相談・返答・承認）になっているか？
  criteria:
    "true": "作業の指示、質問・確認（反語や「〜よね？」「〜かな？」等の口語表現を含む）、相談・壁打ち、方針の選択・表明（「〜しよう」「〜しておこう」等）、または会話への返答・承認（「了解」「LGTM」「返信した」等）である。"
    "false": "動詞・疑問・要求がない単なる名詞句やファイルパス・エラーログの貼付のみ（例:「ログインの送信ボタン」「/tmp/a.md」）、説明のない画像添付のみ、用件のない挨拶のみ（例:「hi」）、または接続詞・間投詞だけで途切れた未完結文（例:「あと、」）である。"
  clarification: 行いたい操作、確認したい質問、または返答内容を最後まで入力してください。

actionable:
  label: 対応の妥当性
  question: user_prompt単体または直前の会話を踏まえて、対象や相談テーマ・進むべき方向を矛盾なく特定できるか？
  criteria:
    "true": "対象やテーマが特定できる作業指示・相談・壁打ち・質問、または直前の会話を踏まえた確認・承認・方針決定・別タスクへの切り替えであり、方向性が特定できる。選択肢に対してどれを選ぶか明示されている場合も含む。"
    "false": "会話に文脈がない指示語（「それ」「これ」等）による操作、会話がない状態での対象不明な操作（例:「コミット」）、複数選択肢を提示されたのにどれを選ぶか未指定の応答（例: AかBか聞かれて「それで進めて」）、または同時に満たせない相反する条件の指示である。"
  clarification: 対象の指定、選択肢の選択、または矛盾する条件の解消を行ってください。
